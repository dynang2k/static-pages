<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>static-pages</title>
<style>
  :root {
    --bg: #faf9f6;
    --card-bg: #ffffff;
    --text: #1f2328;
    --text-dim: #5b6168;
    --border: #e4e1da;
    --accent: #2b6cb0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --card-bg: #202225;
      --text: #e7e6e3;
      --text-dim: #a2a6ab;
      --border: #33363a;
      --accent: #6fa8dc;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  p.sub { color: var(--text-dim); font-size: 0.85rem; margin-top: 0; margin-bottom: 28px; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  li.item {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 10px;
  }
  li.item a {
    color: var(--accent);
    text-decoration: none;
    font-size: 1rem;
    font-weight: 600;
  }
  li.item a:hover { text-decoration: underline; }
  li.item .date {
    display: block;
    color: var(--text-dim);
    font-size: 0.78rem;
    margin-bottom: 4px;
  }
  h2.group {
    font-size: 0.95rem;
    color: var(--accent);
    margin: 28px 0 10px;
  }
</style>
</head>
